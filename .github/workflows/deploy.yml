name: Deploy with Config

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 生成 config.js
        run: |
          echo "const CONFIG = {" > config.js
          echo "    GITHUB_TOKEN: '${{ secrets.MY_GITHUB_TOKEN }}'," >> config.js
          echo "    GITHUB_USER: 'a133-a11y'," >> config.js
          echo "    GITHUB_REPO: 'a133-a11y.github.io'," >> config.js
          echo "    USERS_FILE: 'users.json'," >> config.js
          echo "    POSTS_FILE: 'posts.json'," >> config.js
          echo "    SECRET_KEY: '${{ secrets.MY_SECRET_KEY }}'" >> config.js
          echo "};" >> config.js

      - name: 准备部署目录
        run: |
          mkdir -p public
          cp *.html public/ || true
          cp *.json public/ || true
          cp config.js public/ || true
          # 如果你有其他资源文件，按需添加

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
