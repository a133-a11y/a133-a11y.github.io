name: 部署时生成 config.js

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 用 Secrets 生成 config.js
        run: |
          echo "const CONFIG = {" > config.js
          echo "    GITHUB_TOKEN: '${{ secrets.MY_GITHUB_TOKEN }}'," >> config.js
          echo "    GITHUB_USER: 'a133-a11y'," >> config.js
          echo "    GITHUB_REPO: 'a133-a11y.github.io'," >> config.js
          echo "    USERS_FILE: 'users.json'," >> config.js
          echo "    POSTS_FILE: 'posts.json'," >> config.js
          echo "    SECRET_KEY: '${{ secrets.MY_SECRET_KEY }}'" >> config.js
          echo "};" >> config.js

      - name: 提交 config.js 到仓库
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add config.js
          git commit -m "更新 config.js（由 Actions 生成）" || echo "没有变化"
          git push
