  <style>
    body {
        background-color: burlywood;
        font-family: "微软雅黑",sans-serif;
        text-align: center;
        padding: 50px;
    }
    h1 {
        color: gold;
        font-size: 2.5em;
    }
    body > p {
        color: blanchedalmond;
        font-size: 1.2em;
        border: 1px color darkgoldenrod;
        padding: 20px;
        border-radius: 10px;
    }
    .navbar {
        background-color: white;
        padding: 15px;
        border-radius: 8px 10px;
 

        margin: 10px;
        display: flex;
        justify-content: center;
        gap: 30px; 
        box-shadow: 0.4px 8px rgba(0,0,0,0.2) ;

    }
    .navbar a {
        color: aqua;
        text-decoration: none;

    }
    .navbar a:hover {
        color: aliceblue;
        background-color:rgba(red, green, blue, alpha);
    }
    .text h1 {
          color: darkgoldenrod;
          font-size: 4.5em;
          padding-top: 0px;
    }
    h2  {
      text-align: center;
      color: rgba(128, 255, 0, 0.808);

    }
    .foot {
        background-color: aliceblue;
        justify-content: under;
        position: fixed;
        bottom: 0;
        width: 100%;

      }
      .foot p {
        color: aqua;
      }
    .box-container {
        display: flex; /* 使用flex弹性布局，让内部子元素（三个方框）默认横排 */
        justify-content: center; /* 让子元素在主轴（横向）上居中排列 */
        gap: 20px; /* 子元素之间的间距为20像素 */
        margin-top: 30px; /* 与上方介绍区域保持30像素的距离 */
      }
    .box {
      background-color: darkgoldenrod;
      border: 2px solid  darkblue;
      border-radius: 20px ;
      padding: 10px 20px;
      width: 200px; 
      display: flex;
      flex-direction: column;
      justify-content: center; /* 内部内容垂直居中 */
        align-items: center; /* 内部内容水平居中 */
    }
    .box h3 {
      margin: 0 0 8px 0; /* 外边距：上0，右0，下8像素，左0（只保留底部间距） */
        color: #2c3e50; /* 标题颜色与主标题一致，保持统一 */
        font-size: 1.2em; /* 标题大小稍大 */
    }
    .box h4 {
      color: brown;
    }
     /* .box p：方框内的段落文字样式（覆盖全局p样式） */
     .box p {
        margin: 0; /* 去掉段落默认的外边距，避免多余空白 */
        color: #333333; /* 深灰色文字，在浅蓝背景上清晰 */
        border: none; /* 去掉方框内段落的边框，因为父容器已有边框 */
        padding: 0; /* 去掉内边距，使用方框本身的内边距即可 */
        font-size: 0.95em; /* 文字稍小一点，与标题形成层级对比 */
        border-radius: 0; /* 去掉圆角，避免内部文字区域额外出现圆角 */
        background-color: transparent; /* 背景透明，显示方框自身的背景色 */
      }
      .a {
        color: rgb(110, 7, 206);
        text-decoration: none;
        position: fixed;
        bottom: 40px;
        box-shadow:0.4px 8px rgba(0,0,0,0.2);

      }
      .ah3 {
        color: rgb(110,7,206);
      }
 
  </style>

    </div>
    <div class="box-container">
      <div class="box">
        <h3>开发</h3>
        <p>以java语言开服</p>

      </div>
