<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>MRL</title>
    <link rel="icon" href="" type="image/png">
  </head>
  <style>
    body {
      background-color: burlywood;
      font-family: "微软雅黑", sans-serif;
      text-align: center;
      padding: 50px 50px 150px;
    }
    h1 {
      color: gold;
      font-size: 2.5em;
    }
    body > p {
      color: blanchedalmond;
      font-size: 1.2em;
      border: 1px solid darkgoldenrod;
      padding: 20px;
      border-radius: 10px;
    }
    .navbar {
      background-color: white;
      padding: 15px;
      border-radius: 8px 10px;
      margin: 10px;
      display: flex;
      justify-content: center;
      gap: 30px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    .navbar a {
      color: aqua;
      text-decoration: none;
    }
    .navbar a:hover {
      color: aliceblue;
      background-color: rgba(0, 0, 0, 0.2);
    }
    .text h1 {
      color: darkgoldenrod;
      font-size: 4.5em;
      padding-top: 0;
    }
    h2 {
      text-align: center;
      color: rgba(128, 255, 0, 0.808);
    }
    .foot {
      background-color: aliceblue;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 10px 0;
    }
    .foot p {
      color: aqua;
      margin: 0;
    }
    .box-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }
    .box {
      background-color: darkgoldenrod;
      border: 2px solid darkblue;
      border-radius: 20px;
      padding: 10px 20px;
      width: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .box h3 {
      margin: 0 0 8px 0;
      color: #2c3e50;
      font-size: 1.2em;
    }
    .box h4 {
      color: brown;
    }
    .box p {
      margin: 0;
      color: #333333;
      border: none;
      padding: 0;
      font-size: 0.95em;
      border-radius: 0;
      background-color: transparent;
    }
    .main-pic {
      display: block;
      width: 60%;
      max-width: 600px;
      margin: 30px auto 0;
      border-radius: 10px;
      width: 35em;
    }
    .a {
      color: rgb(110, 7, 206);
      text-decoration: none;
      position: fixed;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    .ah3 {
      color: rgb(110, 7, 206);
    }
  
  </style>
  <body>
    <div class="text">
      <h1>MRL启动器</h1>
    </div>

    <div class="navbar">
      <a href="xiazai.html">下载</a>
      <a href="xiangqingmrl">详情</a>
      <a href="https://github.com/a133-a11y/MRL">开源</a>
    </div>

    <div class="h2">
      <h2>创新    绿色   开放   共享    协调</h2>
    </div>

    <div class="box-container">
      <div class="box">
        <h3>开发</h3>
        <p>以java语言开服</p>
        <p>参考PCL2/HMCL</p>
      </div>
      <div class="box">
        <h3>介绍</h3>
        <p>一款作者认为比较垃圾的启动器</p>
        <p>为MC奋斗而奋斗</p>
      </div>
      <div class="box">
        <h3>反馈</h3>
        <h4>bug之类邮箱底部</h4>
      </div>
    </div>

    <!-- 图片放在 box-container 外面，单独一行 -->
    <img src="a133-a11y.github.io/img/1.png">
    <img class="main-pic" src="img/4.png" alt="版本列表">
    <img class="main-pic" src="img/7.png" alt="启动设置">
    <img class="main-pic" src="img/3.png" alt="启动设置">
    <img class="main-pic" src="img/2.png" alt="下载">
    <img class="main-pic" src="img/6.png" alt="Mod下载">
    <img class="main-pic" src="img/5.png" alt="更多">
    
    <div class="a">
      <a href="https://afdian.com/a/inthetopmc">
        <div class="ah3"><h3>爱发电主页</h3></div>
      </a>
    </div>

    <footer class="foot">
      <p>邮箱：minecraftluncher@163.com</p>
    </footer>
  </body>
</html>
