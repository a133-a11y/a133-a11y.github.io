<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>登录 - 自制网</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a2a3a, #2c3e50);
            font-family: "微软雅黑", sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: #ffffff;
            border-radius: 20px;
            padding: 45px 40px;
            width: 400px;
            max-width: 92%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .login-box h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 6px;
        }

        .login-box .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .login-box label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .login-box input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.3s;
            margin-bottom: 18px;
        }

        .login-box input:focus {
            outline: none;
            border-color: #2c3e50;
        }

        .login-box .submit-btn {
            width: 100%;
            padding: 14px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.3s;
        }

        .login-box .submit-btn:hover {
            background: #1a2a3a;
        }

        .login-box .register-link {
            text-align: center;
            margin-top: 18px;
            color: #888;
            font-size: 14px;
        }

        .login-box .register-link a {
            color: #2c3e50;
            text-decoration: none;
            font-weight: 600;
        }

        .login-box .register-link a:hover {
            text-decoration: underline;
        }

        .msg {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }

        .msg.error {
            display: block;
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }

        .msg.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>🔐 登录</h1>
        <p class="subtitle">登录你的论坛账号</p>

        <div class="msg" id="msgBox"></div>

        <label>账号名</label>
        <input type="text" id="username" placeholder="请输入账号名">

        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码">

        <button class="submit-btn" onclick="handleLogin()">登 录</button>

        <div class="register-link">
            还没有账号？<a href="register.html">去注册</a>
        </div>
    </div>

    <script>
        function getUsers() {
            const data = localStorage.getItem('forum_users');
            return data ? JSON.parse(data) : [];
        }

        function showMsg(text, type) {
            const box = document.getElementById('msgBox');
            box.textContent = text;
            box.className = 'msg ' + type;
            clearTimeout(box._timer);
            box._timer = setTimeout(function() {
                box.className = 'msg';
            }, 5000);
        }

        function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username) {
                showMsg('❌ 请输入账号名！', 'error');
                document.getElementById('username').focus();
                return;
            }
            if (!password) {
                showMsg('❌ 请输入密码！', 'error');
                document.getElementById('password').focus();
                return;
            }

            const users = getUsers();
            const found = users.find(u => u.username === username && u.password === password);

            if (found) {
                // 保存登录状态
                localStorage.setItem('forum_current_user', username);
                showMsg('✅ 登录成功！3秒后跳转到论坛...', 'success');
                setTimeout(function() {
                    window.location.href = 'luntan.html';
                }, 3000);
            } else {
                const exists = users.find(u => u.username === username);
                if (exists) {
                    showMsg('❌ 密码错误！', 'error');
                } else {
                    showMsg('❌ 账号不存在，请先注册！', 'error');
                }
                document.getElementById('password').focus();
            }
        }

        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleLogin();
        });
        document.getElementById('username').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('password').focus();
        });

        console.log('🔐 登录页面已加载！');
    </script>

</body>
</html>
